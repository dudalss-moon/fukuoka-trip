<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUKUOKA FAMILY TRIP · 전체 일정 요약</title>
<style>
:root{--ink:#17324a;--paper:#fff9ef;--sky:#dff4ff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#ccefff 0,#fff8eb 38%,#f4fff8 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em}
.meta{font-weight:800;color:#617b8d}
.home{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;background:#fff;color:#24465d;text-decoration:none;font-weight:950;box-shadow:0 7px 20px #48687822}
.hero{background:#fff;border-radius:26px;padding:14px;box-shadow:0 16px 38px #52758d25}
.hero img{width:100%;display:block;border-radius:18px;background:#eef7fb}
.fallback{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fallback img{width:100%;border-radius:16px;display:block}
.note{margin:14px 2px 0;color:#627b8d;font-weight:750}
@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.fallback{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div>
      <h1>FUKUOKA FAMILY TRIP</h1>
      <div class="meta">2026.10.03 — 10.06 · 👨‍👩‍👦 FAMILY OF 3 · 전체 일정 요약</div>
    </div>
    <a class="home" href="index.html">← 홈으로 돌아가기</a>
  </div>
  <section class="hero">
    <img id="summaryImage" src="assets/trip-summary.png" alt="후쿠오카 가족여행 전체 일정 요약 일러스트">
    <div class="fallback" id="fallback">
      <img src="assets/day1-route-map.png" alt="DAY 1 이동 지도">
      <img src="assets/day2-route-map.png" alt="DAY 2 이동 지도">
      <img src="assets/day3-route-map.png" alt="DAY 3 이동 지도">
      <img src="assets/day4-route-map.png" alt="DAY 4 이동 지도">
    </div>
  </section>
  <p class="note">전체 요약 일러가 등록되지 않은 경우 DAY 1–4 이동 지도가 대신 표시됩니다.</p>
</main>
<script>
const img=document.getElementById('summaryImage'),fb=document.getElementById('fallback');
img.addEventListener('error',()=>{img.style.display='none';fb.style.display='grid'});
</script>
</body>
</html>
